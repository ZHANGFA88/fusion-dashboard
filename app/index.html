<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fusion Console</title>
<link rel="stylesheet" href="/app/assets/fusion.css">
</head>
<body>
<header id="topbar">
  <div class="brand"><span class="logo"></span><span id="brandTx">FUSION</span><small id="tagTx"></small></div>
  <span id="clock" class="num"></span>
  <span id="mktState"></span>
  <div id="topStatus"></div>
  <button id="langBtn" type="button">EN</button>
</header>
<nav id="rail"></nav>
<main id="main">
  <section class="view" id="view-overview"></section>
  <section class="view" id="view-markets"></section>
  <section class="view" id="view-degen"></section>
  <section class="view" id="view-race"></section>
  <section class="view" id="view-spider"></section>
  <section class="view" id="view-safety"></section>
</main>
<script src="/app/assets/i18n.js"></script>
<script src="/app/assets/view-overview.js"></script>
<script src="/app/assets/view-markets.js"></script>
<script src="/app/assets/view-degen.js"></script>
<script src="/app/assets/view-race.js"></script>
<script src="/app/assets/view-spider.js"></script>
<script src="/app/assets/view-safety.js"></script>
<script src="/app/assets/app.js"></script>
</body>
</html>
