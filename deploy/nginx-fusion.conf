# Fusion Dashboard 公网反代模板（nginx）
# ============================================================================
# 重要前提（必读）：
#   8770（主干）与 4317（蜘蛛）两个端口都没有登录鉴权。
#   绝不要把这两个端口直接映射/暴露到公网——公网访问必须套这一层
#   （或同等的访问控制：IP 白名单、VPN、Tailscale 等）。
#
# 为什么蜘蛛不能走子路径（如 https://你的域名/spider/）：
#   蜘蛛前端使用绝对路径资源（/boot.js、/lib/...），子路径下会 404。
#   所以必须用「子域名」给它一个独立的根路径。
# ============================================================================
#
# 使用方法：
#   1. 把下面所有 __DOMAIN__ 替换成你的域名（如 dashboard.example.com），
#      蜘蛛子域名会自动变成 spider.__DOMAIN__。
#   2. 放到 /etc/nginx/sites-available/fusion，软链到 sites-enabled，nginx -t && systemctl reload nginx
#   3. 先用 HTTP 跑通，再用 certbot 上 HTTPS（见 deploy/README.md）。

# --- 主域名 → 8770：门户 / finance / Degen / 赛跑 / 安全阅读页 ---
server {
    listen 80;
    server_name __DOMAIN__;

    # 可选：HTTP Basic Auth（给整站加一层密码，强烈建议开启）
    # 1) 生成密码文件：sudo sh -c "printf 'xinya:$(openssl passwd -apr1)\n' > /etc/nginx/.htpasswd_fusion"
    # 2) 取消下面两行的注释：
    # auth_basic "Fusion Dashboard";
    # auth_basic_user_file /etc/nginx/.htpasswd_fusion;

    location / {
        proxy_pass http://127.0.0.1:8770;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # FinSight 接口是短轮询/普通请求，不需要 websocket；保持默认超时即可
    }
}

# --- spider.子域名 → 4317：机械蜘蛛（必须独占根路径） ---
server {
    listen 80;
    server_name spider.__DOMAIN__;

    # 同样建议加密码（与主域名用同一份密码文件即可）：
    # auth_basic "Prompt Spider";
    # auth_basic_user_file /etc/nginx/.htpasswd_fusion;

    location / {
        proxy_pass http://127.0.0.1:4317;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 蜘蛛的 /status 与会话接口都是 HTTP 长轮询/普通请求：
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
    }
}

# HTTPS（certbot 一条命令即可，示例）：
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d __DOMAIN__ -d spider.__DOMAIN__
# certbot 会自动在本文件里插入 443 与证书配置。
